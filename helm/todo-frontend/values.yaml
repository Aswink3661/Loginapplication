# Default values for todo-frontend.
# Override per environment with values-<env>.yaml or --set flags.

# ── Namespace ─────────────────────────────────────────────────────────────────
namespace:
  create: false # namespace is created by Helm with --create-namespace
  name: loginapp-dev
  labels:
    project: loginapp
    environment: dev
# ── Naming ───────────────────────────────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""
deployment:
  name: todo-app-frontend
# ── Image ─────────────────────────────────────────────────────────────────────
image:
  repository: ghcr.io/aswink3661/todo-app-frontend
  tag: "sha-ab62dd0" # Populated automatically by CI/CD (e.g. sha-a1b2c3d)
  pullPolicy: Always
# ── Replica count ─────────────────────────────────────────────────────────────
replicaCount: 2
# ── Service ───────────────────────────────────────────────────────────────────
service:
  name: todo-app-frontend
  type: ClusterIP
  port: 80
  targetPort: 80
# ── ConfigMap – non-sensitive runtime config ──────────────────────────────────
# All keys are injected as environment variables via envFrom.configMapRef.
configMap:
  create: true
  name: ""
  data:
    APP_NAME: "Todo Frontend"
    ENVIRONMENT: "development"
    API_BASE_URL: "/api/v1"
# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  name: todo-app-frontend
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/success-codes: "200"
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
# ── Resources ─────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"
# ── Probes ────────────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1
# ── Nginx ConfigMap ───────────────────────────────────────────────────────────
nginx:
  configMapName: frontend-nginx-config
  # Name of the backend service that nginx will proxy /api/ and /health to
  backendServiceName: todo-app-backend
  backendPort: 8000
# ── Secret – sensitive runtime config ─────────────────────────────────────────
# Keep data empty here; provide real values through environment-specific files,
# CI/CD, or --set-string so secrets are not committed to source control.
secret:
  create: true
  name: ""
  data: {}
# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  project: loginapp
  environment: dev
