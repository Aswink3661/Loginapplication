apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todo-frontend.deploymentName" . }}
  namespace: {{ include "todo-frontend.namespace" . }}
  labels:
    {{- include "todo-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "todo-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "todo-frontend.labels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
              protocol: TCP
          {{- $hasConfigMap := and .Values.configMap.create .Values.configMap.data }}
          {{- $hasSecret := and .Values.secret.create .Values.secret.data }}
          {{- if or $hasConfigMap $hasSecret }}
          envFrom:
            {{- if $hasConfigMap }}
            - configMapRef:
                name: {{ include "todo-frontend.appConfigName" . }}
            {{- end }}
            {{- if $hasSecret }}
            - secretRef:
                name: {{ include "todo-frontend.secretName" . }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "todo-frontend.nginxConfigName" . }}
