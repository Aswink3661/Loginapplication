{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-frontend.fullname" . }}-secret
  namespace: {{ include "todo-frontend.namespace" . }}
  labels:
    {{- include "todo-frontend.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- with .Values.secret.data }}
stringData:
  {{- range $key, $val := . }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
{{- end }}
