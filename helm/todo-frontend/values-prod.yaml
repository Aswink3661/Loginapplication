# Environment overrides for prod
namespace:
  name: loginapp-prod
  labels:
    project: loginapp
    environment: prod

image:
  tag: "stable"

replicaCount: 3

configMap:
  create: true
  data:
    APP_NAME: "Todo Frontend"
    ENVIRONMENT: "production"
    API_BASE_URL: "/api/v1"

secret:
  create: true
  data: {}

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

labels:
  project: loginapp
  environment: prod
