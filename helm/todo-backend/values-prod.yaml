# Environment overrides for prod
namespace:
  create: false
  name: loginapp-prod
  labels:
    project: loginapp
    environment: prod

image:
  tag: "stable"

replicaCount: 3

configMap:
  data:
    ENVIRONMENT: "production"
    DEBUG: "false"
    LOG_LEVEL: "INFO"
    LOG_TO_FILE: "true"
    WORKERS: "2"

secret:
  create: true
  data:
    SECRET_KEY: "prod-secret-key-replace-me"

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

labels:
  project: loginapp
  environment: prod
