# Default values for todo-backend.
# Override per environment with values-<env>.yaml or --set flags.

# ── Namespace ─────────────────────────────────────────────────────────────────
namespace:
  create: false # frontend chart already creates loginapp-dev
  name: loginapp-dev
  labels:
    project: loginapp
    environment: dev
# ── Naming ───────────────────────────────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""
deployment:
  name: todo-app-backend
# ── Image ─────────────────────────────────────────────────────────────────────
image:
  repository: ghcr.io/aswink3661/todo-app-backend
  tag: "sha-c6983a9" # Populated automatically by CI/CD (e.g. sha-a1b2c3d)
  pullPolicy: Always
# ── Replica count ─────────────────────────────────────────────────────────────
replicaCount: 2
# ── Service ───────────────────────────────────────────────────────────────────
service:
  name: todo-app-backend
  type: ClusterIP
  port: 8000
  targetPort: 8000
# ── Ingress ───────────────────────────────────────────────────────────────────
# The backend is reached via the frontend nginx proxy (/api/, /health).
# Enable this only if you need direct external access to the API.
ingress:
  enabled: false
  name: todo-app-backend
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":8000}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/success-codes: "200"
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
# ── ConfigMap – non-sensitive application config ──────────────────────────────
# All keys are injected as environment variables via envFrom.configMapRef.
configMap:
  name: ""
  data:
    APP_NAME: "Todo API"
    APP_VERSION: "1.0.0"
    ENVIRONMENT: "development"
    DEBUG: "false"
    HOST: "0.0.0.0"
    PORT: "8000"
    WORKERS: "1"
    LOG_LEVEL: "INFO"
    LOG_TO_FILE: "false"
    DEFAULT_PAGE_SIZE: "20"
    MAX_PAGE_SIZE: "100"
# ── Secret – sensitive application config ─────────────────────────────────────
# Values are stored as Kubernetes Opaque Secret and injected via envFrom.secretRef.
# Override per environment; NEVER commit real secrets to source control.
secret:
  create: true
  name: ""
  data:
    SECRET_KEY: "change-me-before-deploying"
# ── Extra individual env overrides (takes precedence over envFrom) ─────────────
# Leave empty unless you need to override a specific key at release time.
env: {}
# ── Pod security ───────────────────────────────────────────────────────────────
podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001
# ── Resources ─────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"
# ── Persistent storage ─────────────────────────────────────────────────────────
storage:
  enabled: false
  volumeName: docs-storage
  mountPath: /opt/docs
  size: 5Gi
  accessModes:
    - ReadWriteMany
  efs:
    fileSystemId: ""
    accessPointId: ""
  storageClass:
    create: true
    name: efs-sc
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    mountOptions:
      - tls
  persistentVolume:
    create: true
    name: todo-backend-docs-efs-pv
    reclaimPolicy: Retain
  persistentVolumeClaim:
    create: true
    name: todo-backend-docs
# ── Probes ────────────────────────────────────────────────────────────────────
startupProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 12
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1
# ── Labels ────────────────────────────────────────────────────────────────────
labels:
  project: loginapp
  environment: dev
