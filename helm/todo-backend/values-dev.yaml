# Environment overrides for dev
namespace:
  create: false
  name: loginapp-dev
  labels:
    project: loginapp
    environment: dev

# image.tag is set dynamically by CI/CD; do not override here

replicaCount: 2

storage:
  enabled: false

configMap:
  data:
    ENVIRONMENT: "development"
    DEBUG: "true"
    LOG_LEVEL: "DEBUG"
    LOG_TO_FILE: "false"

secret:
  create: true
  data:
    SECRET_KEY: "dev-secret-key-replace-me"

labels:
  project: loginapp
  environment: dev
